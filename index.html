<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ループドラムパッド</title>
<style>
:root{--bg:#efeae0;--panel:#e2dccf;--ink:#1d1a16;--mute:#7a7366;--pad:#d3ccbc;--accent:#e4572e;--on:#1d1a16;--step:#cfc8b7;--beat:#bfb7a4;--cd:#e4572e;--cp:#2a9d8f;--cs:#7b5cd6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--panel:#202226;--ink:#eceae4;--mute:#8b8d93;--pad:#2c2f35;--accent:#ffb000;--on:#ffb000;--step:#2a2d33;--beat:#383b43;--cd:#ff7a59;--cp:#4fd1c0;--cs:#a78bfa;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Sans","Noto Sans JP",sans-serif;padding:12px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
main{max-width:720px;margin:0 auto;display:grid;gap:10px}
button,select{font:inherit;color:var(--ink);background:var(--pad);border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.sel{background:var(--ink);color:var(--bg)}button:disabled{opacity:.4;cursor:default}
.top{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.top button{height:62px;font-size:20px;border-radius:16px}
#play{background:var(--accent);color:#fff}#play.on{background:var(--ink);color:var(--bg)}
#rec.on{background:#d62828;color:#fff}
.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);padding:10px;border-radius:14px}
label,.seg{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute)}
.seg span,.seg{gap:4px}.seg button{padding:8px 11px}
input[type=range]{accent-color:var(--accent);width:110px}
#bpmv{color:var(--ink);font-weight:700;min-width:2.2em;display:inline-block}
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pw{display:grid;gap:4px}
.pad{height:clamp(84px,17vh,140px);border-radius:16px;background:var(--pad);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:10px 12px;font-size:17px;border-bottom:6px solid rgba(0,0,0,.25);border-left:6px solid var(--c);transition:transform .05s;touch-action:none}
.pad small{font-weight:400;color:var(--mute);font-size:12px}
.pad.hit{background:var(--c);color:#fff;transform:translateY(3px);border-bottom-width:3px}
.pad.hit small{color:#fff}
.pw select{width:100%;font-size:16px;padding:7px 8px;font-weight:400;background:var(--panel)}
.d{--c:var(--cd)}.p{--c:var(--cp)}.s{--c:var(--cs)}
#fx{position:relative;height:76px;border-radius:16px;background:var(--panel);overflow:hidden;touch-action:none;cursor:crosshair;display:flex;align-items:center;justify-content:center}
#fx span{font-size:13px;color:var(--mute)}
#dot{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--accent);left:50%;top:50%;opacity:.3;transition:opacity .1s}
#fx.on #dot{opacity:1}
.seq{background:var(--panel);padding:10px;border-radius:14px}
.row{display:grid;grid-template-columns:10px repeat(16,1fr);gap:3px;margin-bottom:3px;align-items:center}
.row b{width:8px;height:8px;border-radius:50%;background:var(--c)}
.c{height:40px;padding:0;border-radius:5px;background:var(--step);touch-action:none}
.c.b{background:var(--beat)}.c.on{background:var(--on)}
.c.cur{outline:3px solid var(--accent);outline-offset:-1px}
.c.pk{box-shadow:inset 0 0 0 3px var(--cs)}
.c.tl{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:-3px}.c.tr{border-top-left-radius:0;border-bottom-left-radius:0}
#cd{position:fixed;inset:0;display:grid;place-items:center;font-size:30vmin;font-weight:900;color:var(--accent);pointer-events:none;z-index:10;text-shadow:0 4px 30px rgba(0,0,0,.25)}
.hint{font-size:13px;color:var(--mute);margin:0;line-height:1.6}
audio{flex:1;min-width:200px}
@media (min-width:640px){.pads{gap:12px}}
</style></style>
</head>
<body>
<div id="cd" aria-live="assertive"></div>
<main>
 <div class="top"><button id="rec">● 録音</button><button id="play">▶ 再生</button></div>
 <div class="bar2"><label>テンポ <input id="bpm" type="range" min="60" max="180" value="100"><span id="bpmv">100</span></label><label>音量 <input id="vol" type="range" min="0" max="100" value="80"></label></div>
 <div class="pads" id="pads"></div>
 <div id="fx"><div id="dot"></div><span>ここを押したまま動かす：左右でビブラートの深さ、上下で速さ</span></div>
 <div class="bar2"><div class="seg">長さ<span id="lens"></span></div><div class="seg">小節<span id="tabs"></span></div></div>
 <div class="seq" id="seq"></div>
 <div class="bar2" id="selbar" hidden><span class="seg" id="mv"></span></div>
 <div class="bar2"><button id="clk" class="sel">クリック</button><button id="demo">サンプル</button><button id="clear">全消去</button><button id="exp">WAV書き出し</button></div>
 <div class="bar2" id="xp" hidden><audio id="au" controls></audio><a id="dl" download="drumpad-loop.wav">保存</a></div>
 <p class="hint">パッドをタップで演奏、パッド下のメニューで楽器を入れ替え。録音を押すと3・2・1のカウントのあと、ループが走り出して叩いたリズムが入ります。マスはタップでオン/オフ、横ドラッグで連続入力（紫の楽器は長い音）。マスを長押ししてからドラッグで範囲選択、選択したマスはそのままドラッグで移動できます。</p>
</main>
<script>
const L=16,MAXB=4;
const T=[
 {n:'キック',k:'Q',c:'d'},{n:'スネア',k:'W',c:'d'},{n:'クローズHH',k:'E',c:'p'},{n:'オープンHH',k:'R',c:'p'},
 {n:'クラップ',k:'A',c:'d'},{n:'タム',k:'S',c:'d'},{n:'リム',k:'D',c:'p'},{n:'カウベル',k:'F',c:'p'},
 {n:'クラッシュ',k:'Z',c:'p'},{n:'ベース',k:'X',c:'s'},{n:'リード',k:'C',c:'s'},{n:'コード',k:'V',c:'s'}];
let ac,master,bus,vib,lfo,lfoG,noiseBuf;
const NS=6,SL=[0,1,2,3,9,11],KEYS=['Q','W','E','A','S','D'],grid=SL.map(()=>Array(MAXB*L).fill(false));
let bars=1,viewBar=0,follow=true,playing=false,rec=false,step=0,next=0,timer,vis={s:0,t:0};
const $=id=>document.getElementById(id);
function init(){
 if(ac){ac.resume();return}
 ac=new (window.AudioContext||window.webkitAudioContext)();
 master=ac.createGain();master.gain.value=$('vol').value/100;
 const comp=ac.createDynamicsCompressor();
 bus=ac.createGain();vib=ac.createDelay(.1);vib.delayTime.value=.006;lfo=ac.createOscillator();lfo.frequency.value=5.5;lfoG=ac.createGain();lfoG.gain.value=0;lfo.connect(lfoG);lfoG.connect(vib.delayTime);lfo.start();
 bus.connect(vib);vib.connect(master);master.connect(comp);comp.connect(ac.destination);
 noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
 const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function setFx(x,y,on){
 if(!ac)return;const t=ac.currentTime;
 if(on){lfo.frequency.setTargetAtTime(3+(1-y)*7,t,.03);lfoG.gain.setTargetAtTime(x*.005,t,.03)}
 else lfoG.gain.setTargetAtTime(0,t,.05);
}
function env(g,t,a,dur){g.gain.setValueAtTime(a,t);g.gain.exponentialRampToValueAtTime(.001,t+dur)}
function osc(type,f0,f1,t,dur,a){
 const o=ac.createOscillator(),g=ac.createGain();o.type=type;
 o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
 env(g,t,a,dur);o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.05);
}
function noise(t,dur,a,ft,freq,q){
 const s=ac.createBufferSource();s.buffer=noiseBuf;
 const f=ac.createBiquadFilter();f.type=ft;f.frequency.value=freq;if(q)f.Q.value=q;
 const g=ac.createGain();env(g,t,a,dur);s.connect(f);f.connect(g);g.connect(bus);s.start(t);s.stop(t+dur+.05);
}
function sus(type,fs,t,dur,cut,a){
 const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;
 const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+.01);
 const os=fs.map(fr=>{const o=ac.createOscillator();o.type=type;o.frequency.value=fr;o.connect(f);o.start(t);return o});
 f.connect(g);g.connect(bus);
 const rel=tt=>{g.gain.setTargetAtTime(0,tt,.04);os.forEach(o=>o.stop(tt+.4))};
 if(dur){rel(t+dur)}else return rel;
}
const V=[
 t=>{osc('sine',160,40,t,.35,1.1);noise(t,.02,.3,'lowpass',1500)},
 t=>{osc('triangle',220,140,t,.15,.6);noise(t,.2,.7,'highpass',1800)},
 t=>noise(t,.05,.5,'highpass',7500),
 t=>noise(t,.3,.45,'highpass',7000),
 t=>{[0,.012,.024].forEach(o=>noise(t+o,.03,.6,'bandpass',1500,1.2));noise(t+.03,.18,.5,'bandpass',1500,1.2)},
 t=>osc('sine',200,90,t,.3,.9),
 t=>{osc('square',800,800,t,.04,.25);noise(t,.03,.4,'bandpass',3500,2)},
 t=>{osc('square',540,540,t,.25,.25);osc('square',800,800,t,.25,.25)},
 t=>{noise(t,1.2,.4,'highpass',5500);noise(t,.6,.3,'bandpass',9000,1)},
 (t,d)=>sus('sawtooth',[55],t,d,600,.5),
 (t,d)=>sus('square',[220,220.8],t,d,2600,.18),
 (t,d)=>sus('sawtooth',[220,261.63,329.63],t,d,1800,.12)
];
const trig=(i,t,d)=>V[SL[i]](t||ac.currentTime,d);
const padEls=[],rowEls=[],sels=[];
function flash(i){const p=padEls[i];p.classList.add('hit');setTimeout(()=>p.classList.remove('hit'),110)}
function hit(i){
 init();let r=trig(i);flash(i);
 if(rec&&playing){
  const spb=60/$('bpm').value/4,tot=bars*L;
  const at=()=>vis.s+(ac.currentTime-vis.t)/spb;
  const s=((Math.round(at())%tot)+tot)%tot;
  grid[i][s]=true;draw();
  if(T[SL[i]].c==='s'){const rl=r;r=tt=>{if(rl)rl(tt);if(playing){let e=((Math.round(at())%tot)+tot)%tot;if(e<s)e=tot;for(let k=s;k<Math.max(s+1,e);k++)grid[i][k%tot]=true;draw()}}}
 }
 return r;
}
const holds=new Map();
function fxFrom(e,el){const r=el.getBoundingClientRect();
 const x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
 setFx(x,y,true);return[x,y]}
function endHold(id){const h=holds.get(id);if(!h)return;holds.delete(id);if(h.rel)h.rel(ac.currentTime);if(!holds.size)setFx(0,0,false)}
const padsEl=$('pads');
SL.forEach((v,i)=>{
 const w=document.createElement('div');w.className='pw';
 const b=document.createElement('button');b.innerHTML='<span></span><small>'+KEYS[i]+'</small>';
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);holds.set(e.pointerId,{rel:hit(i),pad:true})});
 b.addEventListener('pointermove',e=>{if(holds.has(e.pointerId))fxFrom(e,padsEl)});
 ['pointerup','pointercancel'].forEach(n=>b.addEventListener(n,e=>endHold(e.pointerId)));
 const sl=document.createElement('select');sl.setAttribute('aria-label','楽器');T.forEach((t,k)=>sl.add(new Option(t.n,k)));
 sl.onchange=()=>{SL[i]=+sl.value;refresh()};
 w.append(b,sl);padsEl.appendChild(w);padEls.push(b);sels[i]=sl;
});
function refresh(){SL.forEach((v,i)=>{const t=T[v];padEls[i].className='pad '+t.c;padEls[i].firstChild.textContent=t.n;rowEls[i].className='row '+t.c;sels[i].value=v});draw()}
const fx=$('fx'),dot=$('dot');
fx.addEventListener('pointerdown',e=>{init();fx.setPointerCapture(e.pointerId);fx.classList.add('on');holds.set(e.pointerId,{});mv(e)});
function mv(e){if(!holds.has(e.pointerId))return;const[x,y]=fxFrom(e,fx);dot.style.left=x*100+'%';dot.style.top=y*100+'%'}
fx.addEventListener('pointermove',mv);
['pointerup','pointercancel'].forEach(n=>fx.addEventListener(n,e=>{endHold(e.pointerId);fx.classList.remove('on')}));
// sequencer UI
const seqEl=$('seq'),cells=[],KK=MAXB*L;let mode='note',sel=new Set(),drag=null;
SL.forEach((v,i)=>{
 const r=document.createElement('div');r.innerHTML='<b></b>';rowEls[i]=r;cells[i]=[];
 for(let s=0;s<L;s++){
  const c=document.createElement('button');c.className='c'+(s%4==0?' b':'');
  c.dataset.i=i;c.dataset.s=s;c.setAttribute('aria-label',(i+1)+'段 '+(s+1));
  r.appendChild(c);cells[i][s]=c;
 }
 seqEl.appendChild(r);
});
function draw(){
 grid.forEach((row,i)=>cells[i].forEach((c,s)=>{const k=viewBar*L+s,on=row[k],sy=T[SL[i]].c==='s';
  c.classList.toggle('on',on);c.classList.toggle('pk',sel.has(i*KK+k));
  c.classList.toggle('tl',sy&&on&&s<L-1&&!!row[k+1]);c.classList.toggle('tr',sy&&on&&s>0&&!!row[k-1])}));
 $('selbar').hidden=!sel.size;
}
function mark(s){cells.forEach(r=>r.forEach((c,k)=>c.classList.toggle('cur',s>=0&&Math.floor(s/L)===viewBar&&k===s%L)))}
const selList=()=>[...sel].map(x=>[Math.floor(x/KK),x%KK]);
function place(snap,base,dx,dy){
 const tot=bars*L,ks=base.map(b=>b[1]),is=base.map(b=>b[0]);
 dx=Math.max(-Math.min(...ks),Math.min(tot-1-Math.max(...ks),dx));
 dy=Math.max(-Math.min(...is),Math.min(NS-1-Math.max(...is),dy));
 grid.forEach((r,i)=>snap[i].forEach((v,k)=>r[k]=v));
 base.forEach(([i,k])=>grid[i][k]=false);
 base.forEach(([i,k])=>{if(snap[i][k])grid[i+dy][k+dx]=true});
 sel=new Set(base.map(([i,k])=>(i+dy)*KK+k+dx));draw();
}
function cellAt(e){const el=document.elementFromPoint(e.clientX,e.clientY),c=el&&el.closest&&el.closest('.c');return c?{i:+c.dataset.i,s:+c.dataset.s}:null}
seqEl.addEventListener('contextmenu',e=>e.preventDefault());
seqEl.addEventListener('pointerdown',e=>{
 const c=e.target.closest('.c');if(!c)return;e.preventDefault();init();
 const i=+c.dataset.i,s=+c.dataset.s,k=viewBar*L+s;
 const d=drag={i,s,k,i1:i,s1:s,moved:false,row:grid[i].slice()};
 if(sel.has(i*KK+k)){d.type='move';d.snap=grid.map(r=>r.slice());d.base=selList()}
 else{d.type='paint';d.v=!grid[i][k];
  d.tm=setTimeout(()=>{if(drag!==d||d.moved)return;d.type='rect';d.long=true;sel=new Set([i*KK+k]);draw();navigator.vibrate&&navigator.vibrate(15)},350)}
});
addEventListener('pointermove',e=>{
 const d=drag;if(!d)return;const p=cellAt(e);if(!p||(p.i===d.i1&&p.s===d.s1))return;
 d.i1=p.i;d.s1=p.s;if(p.i!==d.i||p.s!==d.s){d.moved=true;clearTimeout(d.tm)}
 if(d.type==='paint'){
  if(!d.moved)return;
  grid[d.i]=d.row.slice();const a=Math.min(d.s,d.s1),b=Math.max(d.s,d.s1);
  for(let s=a;s<=b;s++)grid[d.i][viewBar*L+s]=d.v;draw();
 }else if(d.type==='rect'){
  sel=new Set();const o=viewBar*L;
  for(let i=Math.min(d.i,d.i1);i<=Math.max(d.i,d.i1);i++)for(let s=Math.min(d.s,d.s1);s<=Math.max(d.s,d.s1);s++)sel.add(i*KK+o+s);
  draw();
 }else place(d.snap,d.base,d.s1-d.s,d.i1-d.i);
});
addEventListener('pointerup',()=>{
 const d=drag;if(!d)return;drag=null;clearTimeout(d.tm);
 if(!d.moved&&!d.long){
  if(d.type==='paint')sel.clear();
  grid[d.i][d.k]=!grid[d.i][d.k];if(grid[d.i][d.k])trig(d.i,0,60/$('bpm').value/4*.9);
  draw();
 }
});
addEventListener('pointercancel',()=>{drag=null});
function segs(){
 $('lens').innerHTML='';[1,2,4].forEach(n=>{const b=document.createElement('button');b.textContent=n+'小節';b.className=n===bars?'sel':'';
  b.onclick=()=>{bars=n;if(viewBar>=bars)viewBar=0;step%=bars*L;sel.clear();segs();draw()};$('lens').appendChild(b)});
 $('tabs').innerHTML='';for(let i=0;i<bars;i++){const b=document.createElement('button');b.textContent=i+1;b.className=i===viewBar?'sel':'';
  b.onclick=()=>{viewBar=i;follow=false;segs();draw()};$('tabs').appendChild(b)}
 $('mv').innerHTML='';[['選択したマスを削除',()=>{selList().forEach(([i,k])=>grid[i][k]=false);sel.clear();draw()}],['選択解除',()=>{sel.clear();draw()}]].forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=f;$('mv').appendChild(b)});
}
let clickOn=true;
function sched(s,t,spb,tot){grid.forEach((row,i)=>{if(!row[s])return;
 if(T[SL[i]].c==='s'){if(s>0&&row[s-1])return;let n=1;while(s+n<tot&&row[s+n])n++;trig(i,t,n*spb-.02)}
 else trig(i,t,spb*.9)})}
function click(t,a){const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=a?1600:1100;env(g,t,.35,.05);o.connect(g);g.connect(master);o.start(t);o.stop(t+.08)}
function tick(){
 const spb=60/$('bpm').value/4,tot=bars*L;
 while(next<ac.currentTime+.12){
  const s=step,t=next;
  if(rec&&clickOn&&s%4===0)click(t,s%L===0);
  sched(s,t,spb,tot);
  setTimeout(()=>{if(!playing)return;vis={s,t};
   if(follow&&Math.floor(s/L)!==viewBar){viewBar=Math.floor(s/L);segs();draw()}
   mark(s);grid.forEach((r,i)=>r[s]&&flash(i))},Math.max(0,(t-ac.currentTime)*1000));
  next+=spb;step=(step+1)%tot;
 }
}
function ui(){$('play').textContent=playing?'■ 停止':'▶ 再生';$('play').classList.toggle('on',playing);$('rec').textContent=rec?'● 録音中':'● 録音';$('rec').classList.toggle('on',rec)}
function startPlay(cnt){
 init();cnt=cnt||0;const bs=60/$('bpm').value,t0=ac.currentTime+.1;
 playing=true;follow=true;step=0;next=t0+cnt*bs;vis={s:0,t:next};
 for(let n=0;n<cnt;n++){click(t0+n*bs,n===0);setTimeout(()=>{if(playing)$('cd').textContent=3-n},Math.max(0,(t0+n*bs-ac.currentTime)*1000))}
 if(cnt)setTimeout(()=>{$('cd').textContent=''},(next-ac.currentTime)*1000);
 timer=setInterval(tick,25);ui();
}
function stopPlay(){playing=false;rec=false;$('cd').textContent='';clearInterval(timer);mark(-1);ui()}
$('play').onclick=()=>playing?stopPlay():startPlay();
$('rec').onclick=()=>{rec=!rec;if(rec&&!playing)startPlay(3);else ui()};
$('clk').onclick=()=>{clickOn=!clickOn;$('clk').classList.toggle('sel',clickOn)};
async function exportWav(){
 init();$('exp').textContent='作成中…';
 const spb=60/$('bpm').value/4,tot=bars*L,R=44100,oc=new OfflineAudioContext(2,Math.ceil((tot*spb+1.5)*R),R),sv=[ac,bus,noiseBuf];
 ac=oc;bus=oc.createGain();bus.gain.value=$('vol').value/100;const cp=oc.createDynamicsCompressor();bus.connect(cp);cp.connect(oc.destination);
 noiseBuf=oc.createBuffer(1,R,R);const nd=noiseBuf.getChannelData(0);for(let i=0;i<R;i++)nd[i]=Math.random()*2-1;
 for(let k=0;k<tot;k++)sched(k,k*spb+.01,spb,tot);
 const p=oc.startRendering();[ac,bus,noiseBuf]=sv;
 const b=await p,n=b.length,d=new DataView(new ArrayBuffer(44+n*4)),w=(o,x)=>[...x].forEach((c,k)=>d.setUint8(o+k,c.charCodeAt(0)));
 w(0,'RIFF');d.setUint32(4,36+n*4,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,2,true);d.setUint32(24,R,true);d.setUint32(28,R*4,true);d.setUint16(32,4,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*4,true);
 const c0=b.getChannelData(0),c1=b.getChannelData(1),q=x=>Math.max(-1,Math.min(1,x))*32767;
 for(let i=0;i<n;i++){d.setInt16(44+i*4,q(c0[i]),true);d.setInt16(46+i*4,q(c1[i]),true)}

$('vol').oninput=e=>{if(master)master.gain.value=e.target.value/100};
$('clear').onclick=()=>{grid.forEach(r=>r.fill(false));sel.clear();draw()};

 grid.forEach(r=>r.fill(false));bars=2;viewBar=0;sel.clear();
 for(let b=0;b<2;b++){const o=b*L;[0,4,8,12].forEach(s=>grid[0][o+s]=true);grid[0][o+10]=true;[4,12].forEach(s=>grid[1][o+s]=true);for(let s=0;s<L;s+=2)grid[2][o+s]=true;[0,3,6,8,11].forEach(s=>grid[4][o+s]=true)}
 grid[3][14]=true;for(let s=0;s<4;s++)grid[5][L+s]=grid[5][L+8+s]=true;

const keys={};KEYS.forEach((k,i)=>keys[k.toLowerCase()]=i);
const kh={};
addEventListener('keydown',e=>{
 if(e.repeat||e.metaKey||e.ctrlKey)return;
 const i=keys[e.key.toLowerCase()];
 if(i!==undefined){kh[i]=hit(i);padEls[i].classList.add('hit')}
 else if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();$('play').click()}
});
addEventListener('keyup',e=>{
 const i=keys[e.key.toLowerCase()];
 if(i!==undefined){if(kh[i])kh[i](ac.currentTime);kh[i]=null;padEls[i].classList.remove('hit')}
});
$('demo').click();
