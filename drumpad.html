<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ループドラムパッド</title>
<style>
:root{--bg:#efeae0;--panel:#e2dccf;--ink:#1d1a16;--mute:#7a7366;--pad:#d3ccbc;--accent:#e4572e;--on:#1d1a16;--step:#cfc8b7;--beat:#bfb7a4;--cd:#e4572e;--cp:#2a9d8f;--cs:#7b5cd6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--panel:#202226;--ink:#eceae4;--mute:#8b8d93;--pad:#2c2f35;--accent:#ffb000;--on:#ffb000;--step:#2a2d33;--beat:#383b43;--cd:#ff7a59;--cp:#4fd1c0;--cs:#a78bfa;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Sans","Noto Sans JP",sans-serif;min-height:100vh;padding:16px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
main{max-width:900px;margin:0 auto;display:grid;gap:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);padding:12px;border-radius:14px}
button{font:inherit;color:var(--ink);background:var(--pad);border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#play{background:var(--accent);color:#fff;min-width:96px}
#play.on{background:var(--ink);color:var(--bg)}
#rec.on{background:#d62828;color:#fff}
button.sel{background:var(--ink);color:var(--bg)}
label,.seg{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.seg{gap:4px}.seg button{padding:8px 12px}
input[type=range]{accent-color:var(--accent);width:110px}
#bpmv{color:var(--ink);font-weight:700;min-width:2.2em;display:inline-block}
.mid{display:grid;grid-template-columns:3fr 2fr;gap:12px}
@media (max-width:640px){.mid{grid-template-columns:1fr}}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pad{aspect-ratio:1.3;border-radius:16px;background:var(--pad);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:10px 12px;font-size:16px;border-bottom:6px solid rgba(0,0,0,.25);border-left:6px solid var(--c);transition:transform .05s;touch-action:none}
.pad small{font-weight:400;color:var(--mute);font-size:12px}
.pad.hit{background:var(--c);color:#fff;transform:translateY(3px);border-bottom-width:3px}
.pad.hit small{color:#fff}
.d{--c:var(--cd)}.p{--c:var(--cp)}.s{--c:var(--cs)}
#fx{position:relative;min-height:170px;border-radius:16px;background:var(--panel);overflow:hidden;touch-action:none;cursor:crosshair;display:flex;align-items:flex-end;padding:12px}
#fx span{font-size:13px;color:var(--mute);line-height:1.6}
#dot{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--accent);left:50%;top:50%;opacity:.3;transition:opacity .1s}
#fx.on #dot{opacity:1}
.seq{background:var(--panel);padding:12px;border-radius:14px;overflow-x:auto}
.row{display:grid;grid-template-columns:62px repeat(16,minmax(14px,1fr));gap:3px;margin-bottom:3px;align-items:center}
.row b{font-size:12px;border-left:5px solid var(--c);padding-left:6px;white-space:nowrap}
.c{height:30px;padding:0;border-radius:6px;background:var(--step);touch-action:none}
.c.b{background:var(--beat)}
.c.on{background:var(--on)}
.c.cur{outline:3px solid var(--accent);outline-offset:-1px}
.c.pk{box-shadow:inset 0 0 0 3px var(--cs)}.c.tl{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:-3px}.c.tr{border-top-left-radius:0;border-bottom-left-radius:0}button:disabled{opacity:.4;cursor:default}
#cd{position:fixed;inset:0;display:grid;place-items:center;font-size:30vmin;font-weight:900;color:var(--accent);pointer-events:none;z-index:10;text-shadow:0 4px 30px rgba(0,0,0,.25)}
.hint{font-size:13px;color:var(--mute);margin:0;line-height:1.6}
</style>
</head>
<body>
<div id="cd" aria-live="assertive"></div>
<main>
 <div class="bar">
  <button id="play">▶ 再生</button>
  <button id="rec">● 録音</button>
  <label>テンポ <input id="bpm" type="range" min="60" max="180" value="100"><span id="bpmv">100</span></label>
  <label>音量 <input id="vol" type="range" min="0" max="100" value="80"></label>
  <div class="seg">長さ<span id="lens"></span></div>
  <button id="clear">全消去</button>
  <button id="demo">サンプル</button>
 </div>
 <div class="mid">
  <div class="pads" id="pads"></div>
  <div id="fx"><div id="dot"></div><span>ここを押したままドラッグ<br>左右：ワウの高さ ／ 上下：効きの強さ<br>（パッドを押しながらドラッグも可）</span></div>
 </div>
 <div class="bar" style="padding:8px 12px"><div class="seg">小節<span id="tabs"></span></div><div class="seg">モード<span id="mode"></span></div><div class="seg" id="mv"></div></div>
 <div class="seq" id="seq"></div>
 <p class="hint">パッド/キー（Q W E R・A S D F・Z X C V）で演奏。録音オンで再生すると叩いたリズムがループに入ります。紫の音色（ベース・リード・コード）は、押している間だけ鳴ります。シーケンサーではマスを横にドラッグするか隣り合うマスを並べると、つながって長く鳴ります。「選択」モードでマスをドラッグで囲み、囲んだマスをドラッグか矢印で移動できます。</p>
</main>
<script>
const L=16,MAXB=4;
const T=[
 {n:'キック',k:'Q',c:'d'},{n:'スネア',k:'W',c:'d'},{n:'クローズHH',k:'E',c:'p'},{n:'オープンHH',k:'R',c:'p'},
 {n:'クラップ',k:'A',c:'d'},{n:'タム',k:'S',c:'d'},{n:'リム',k:'D',c:'p'},{n:'カウベル',k:'F',c:'p'},
 {n:'クラッシュ',k:'Z',c:'p'},{n:'ベース',k:'X',c:'s'},{n:'リード',k:'C',c:'s'},{n:'コード',k:'V',c:'s'}];
let ac,master,bus,wah,lfoG,noiseBuf;
const grid=T.map(()=>Array(MAXB*L).fill(false));
let bars=1,viewBar=0,follow=true,playing=false,rec=false,step=0,next=0,timer,vis={s:0,t:0};
const $=id=>document.getElementById(id);
function init(){
 if(ac){ac.resume();return}
 ac=new (window.AudioContext||window.webkitAudioContext)();
 master=ac.createGain();master.gain.value=$('vol').value/100;
 const comp=ac.createDynamicsCompressor();
 bus=ac.createGain();wah=ac.createBiquadFilter();wah.type='lowpass';wah.frequency.value=20000;wah.Q.value=.7;
 bus.connect(wah);wah.connect(master);master.connect(comp);comp.connect(ac.destination);
 noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
 const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function setFx(x,y,on){
 if(!ac)return;const t=ac.currentTime;
 if(on){wah.frequency.setTargetAtTime(250*Math.pow(70,x),t,.02);wah.Q.setTargetAtTime(2+(1-y)*12,t,.02)}
 else{wah.frequency.setTargetAtTime(20000,t,.05);wah.Q.setTargetAtTime(.7,t,.05)}
}
function env(g,t,a,dur){g.gain.setValueAtTime(a,t);g.gain.exponentialRampToValueAtTime(.001,t+dur)}
function osc(type,f0,f1,t,dur,a){
 const o=ac.createOscillator(),g=ac.createGain();o.type=type;
 o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
 env(g,t,a,dur);o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.05);
}
function noise(t,dur,a,ft,freq,q){
 const s=ac.createBufferSource();s.buffer=noiseBuf;
 const f=ac.createBiquadFilter();f.type=ft;f.frequency.value=freq;if(q)f.Q.value=q;
 const g=ac.createGain();env(g,t,a,dur);s.connect(f);f.connect(g);g.connect(bus);s.start(t);s.stop(t+dur+.05);
}
function sus(type,fs,t,dur,cut,a){
 const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;
 const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+.01);
 const os=fs.map(fr=>{const o=ac.createOscillator();o.type=type;o.frequency.value=fr;o.connect(f);o.start(t);return o});
 f.connect(g);g.connect(bus);
 const rel=tt=>{g.gain.setTargetAtTime(0,tt,.04);os.forEach(o=>o.stop(tt+.4))};
 if(dur){rel(t+dur)}else return rel;
}
const V=[
 t=>{osc('sine',160,40,t,.35,1.1);noise(t,.02,.3,'lowpass',1500)},
 t=>{osc('triangle',220,140,t,.15,.6);noise(t,.2,.7,'highpass',1800)},
 t=>noise(t,.05,.5,'highpass',7500),
 t=>noise(t,.3,.45,'highpass',7000),
 t=>{[0,.012,.024].forEach(o=>noise(t+o,.03,.6,'bandpass',1500,1.2));noise(t+.03,.18,.5,'bandpass',1500,1.2)},
 t=>osc('sine',200,90,t,.3,.9),
 t=>{osc('square',800,800,t,.04,.25);noise(t,.03,.4,'bandpass',3500,2)},
 t=>{osc('square',540,540,t,.25,.25);osc('square',800,800,t,.25,.25)},
 t=>{noise(t,1.2,.4,'highpass',5500);noise(t,.6,.3,'bandpass',9000,1)},
 (t,d)=>sus('sawtooth',[55],t,d,600,.5),
 (t,d)=>sus('square',[220,220.8],t,d,2600,.18),
 (t,d)=>sus('sawtooth',[220,261.63,329.63],t,d,1800,.12)
];
const trig=(i,t,d)=>V[i](t||ac.currentTime,d);
const padEls=[];
function flash(i){const p=padEls[i];p.classList.add('hit');setTimeout(()=>p.classList.remove('hit'),110)}
function hit(i){
 init();let r=trig(i);flash(i);
 if(rec&&playing){
  const spb=60/$('bpm').value/4,tot=bars*L;
  const at=()=>vis.s+(ac.currentTime-vis.t)/spb;
  const s=((Math.round(at())%tot)+tot)%tot;
  grid[i][s]=true;draw();
  if(T[i].c==='s'){const rl=r;r=tt=>{if(rl)rl(tt);if(playing){let e=((Math.round(at())%tot)+tot)%tot;if(e<s)e=tot;for(let k=s;k<Math.max(s+1,e);k++)grid[i][k%tot]=true;draw()}}}
 }
 return r;
}
const holds=new Map();
function fxFrom(e,el){const r=el.getBoundingClientRect();
 const x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
 setFx(x,y,true);return[x,y]}
function endHold(id){const h=holds.get(id);if(!h)return;holds.delete(id);if(h.rel)h.rel(ac.currentTime);if(!holds.size)setFx(0,0,false)}
const padsEl=$('pads');
T.forEach((t,i)=>{
 const b=document.createElement('button');b.className='pad '+t.c;
 b.innerHTML=t.n+'<small>'+t.k+'</small>';
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);holds.set(e.pointerId,{rel:hit(i),pad:true})});
 b.addEventListener('pointermove',e=>{if(holds.has(e.pointerId))fxFrom(e,padsEl)});
 ['pointerup','pointercancel'].forEach(n=>b.addEventListener(n,e=>endHold(e.pointerId)));
 padsEl.appendChild(b);padEls.push(b);
});
const fx=$('fx'),dot=$('dot');
fx.addEventListener('pointerdown',e=>{init();fx.setPointerCapture(e.pointerId);fx.classList.add('on');holds.set(e.pointerId,{});mv(e)});
function mv(e){if(!holds.has(e.pointerId))return;const[x,y]=fxFrom(e,fx);dot.style.left=x*100+'%';dot.style.top=y*100+'%'}
fx.addEventListener('pointermove',mv);
['pointerup','pointercancel'].forEach(n=>fx.addEventListener(n,e=>{endHold(e.pointerId);fx.classList.remove('on')}));
// sequencer UI
const seqEl=$('seq'),cells=[],KK=MAXB*L;let mode='note',sel=new Set(),drag=null;
T.forEach((t,i)=>{
 const r=document.createElement('div');r.className='row '+t.c;
 r.innerHTML='<b>'+t.n+'</b>';cells[i]=[];
 for(let s=0;s<L;s++){
  const c=document.createElement('button');c.className='c'+(s%4==0?' b':'');
  c.dataset.i=i;c.dataset.s=s;c.setAttribute('aria-label',t.n+' '+(s+1));
  r.appendChild(c);cells[i][s]=c;
 }
 seqEl.appendChild(r);
});
function draw(){
 grid.forEach((row,i)=>cells[i].forEach((c,s)=>{const k=viewBar*L+s,on=row[k],sy=T[i].c==='s';
  c.classList.toggle('on',on);c.classList.toggle('pk',sel.has(i*KK+k));
  c.classList.toggle('tl',sy&&on&&s<L-1&&!!row[k+1]);c.classList.toggle('tr',sy&&on&&s>0&&!!row[k-1])}));
 $('mv').querySelectorAll('button').forEach(b=>b.disabled=!sel.size);
}
function mark(s){cells.forEach(r=>r.forEach((c,k)=>c.classList.toggle('cur',s>=0&&Math.floor(s/L)===viewBar&&k===s%L)))}
const selList=()=>[...sel].map(x=>[Math.floor(x/KK),x%KK]);
function place(snap,base,dx,dy){
 const tot=bars*L,ks=base.map(b=>b[1]),is=base.map(b=>b[0]);
 dx=Math.max(-Math.min(...ks),Math.min(tot-1-Math.max(...ks),dx));
 dy=Math.max(-Math.min(...is),Math.min(T.length-1-Math.max(...is),dy));
 grid.forEach((r,i)=>snap[i].forEach((v,k)=>r[k]=v));
 base.forEach(([i,k])=>grid[i][k]=false);
 base.forEach(([i,k])=>{if(snap[i][k])grid[i+dy][k+dx]=true});
 sel=new Set(base.map(([i,k])=>(i+dy)*KK+k+dx));draw();
}
function cellAt(e){const el=document.elementFromPoint(e.clientX,e.clientY),c=el&&el.closest&&el.closest('.c');return c?{i:+c.dataset.i,s:+c.dataset.s}:null}
seqEl.addEventListener('pointerdown',e=>{
 const c=e.target.closest('.c');if(!c)return;e.preventDefault();init();
 const i=+c.dataset.i,s=+c.dataset.s,k=viewBar*L+s;
 drag={i,s,k,i1:i,s1:s,moved:false,row:grid[i].slice()};
 if(mode==='sel'&&sel.has(i*KK+k)){drag.type='move';drag.snap=grid.map(r=>r.slice());drag.base=selList()}
 else if(mode==='sel')drag.type='rect';
 else{drag.type='paint';drag.v=!grid[i][k]}
});
addEventListener('pointermove',e=>{
 const d=drag;if(!d)return;const p=cellAt(e);if(!p||(p.i===d.i1&&p.s===d.s1))return;
 d.i1=p.i;d.s1=p.s;if(p.i!==d.i||p.s!==d.s)d.moved=true;
 if(d.type==='paint'){
  grid[d.i]=d.row.slice();const a=Math.min(d.s,d.s1),b=Math.max(d.s,d.s1);
  for(let s=a;s<=b;s++)grid[d.i][viewBar*L+s]=d.v;draw();
 }else if(d.type==='rect'){
  sel=new Set();const o=viewBar*L;
  for(let i=Math.min(d.i,d.i1);i<=Math.max(d.i,d.i1);i++)for(let s=Math.min(d.s,d.s1);s<=Math.max(d.s,d.s1);s++)sel.add(i*KK+o+s);
  draw();
 }else place(d.snap,d.base,d.s1-d.s,d.i1-d.i);
});
addEventListener('pointerup',()=>{
 const d=drag;if(!d)return;drag=null;
 if(!d.moved){
  const key=d.i*KK+d.k;
  if(mode==='sel'){sel.has(key)?sel.delete(key):sel.add(key)}
  else{grid[d.i][d.k]=d.v;if(d.v)trig(d.i,0,60/$('bpm').value/4*.9)}
  draw();
 }
});
addEventListener('pointercancel',()=>{drag=null});
function segs(){
 $('lens').innerHTML='';[1,2,4].forEach(n=>{const b=document.createElement('button');b.textContent=n+'小節';b.className=n===bars?'sel':'';
  b.onclick=()=>{bars=n;if(viewBar>=bars)viewBar=0;step%=bars*L;sel.clear();segs();draw()};$('lens').appendChild(b)});
 $('tabs').innerHTML='';for(let i=0;i<bars;i++){const b=document.createElement('button');b.textContent=i+1;b.className=i===viewBar?'sel':'';
  b.onclick=()=>{viewBar=i;follow=false;segs();draw()};$('tabs').appendChild(b)}
 $('mode').innerHTML='';[['note','打ち込み'],['sel','選択']].forEach(([m,l])=>{const b=document.createElement('button');b.textContent=l;b.className=m===mode?'sel':'';
  b.onclick=()=>{mode=m;if(m==='note')sel.clear();segs();draw()};$('mode').appendChild(b)});
 $('mv').innerHTML='';[['◀',-1,0],['▶',1,0],['▲',0,-1],['▼',0,1]].forEach(([l,dx,dy])=>{const b=document.createElement('button');b.textContent=l;
  b.onclick=()=>place(grid.map(r=>r.slice()),selList(),dx,dy);$('mv').appendChild(b)});
 const x=document.createElement('button');x.textContent='削除';x.onclick=()=>{selList().forEach(([i,k])=>grid[i][k]=false);sel.clear();draw()};$('mv').appendChild(x);
}
function tick(){
 const spb=60/$('bpm').value/4,tot=bars*L;
 while(next<ac.currentTime+.12){
  const s=step,t=next;
  if(rec&&s%4===0)click(t,s%L===0);
  grid.forEach((row,i)=>{if(!row[s])return;
   if(T[i].c==='s'){if(s>0&&row[s-1])return;let n=1;while(s+n<tot&&row[s+n])n++;trig(i,t,n*spb-.02)}
   else trig(i,t,spb*.9)});
  setTimeout(()=>{if(!playing)return;vis={s,t};
   if(follow&&Math.floor(s/L)!==viewBar){viewBar=Math.floor(s/L);segs();draw()}
   mark(s);grid.forEach((r,i)=>r[s]&&flash(i))},Math.max(0,(t-ac.currentTime)*1000));
  next+=spb;step=(step+1)%tot;
 }
}
function click(t,acc){const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=acc?1600:1100;env(g,t,.35,.05);o.connect(g);g.connect(master);o.start(t);o.stop(t+.08)}
$('play').onclick=()=>{
 init();
 if(playing){playing=false;clearInterval(timer);$('cd').textContent='';$('play').textContent='▶ 再生';$('play').classList.remove('on');mark(-1);return}
 const bs=60/$('bpm').value,t0=ac.currentTime+.1,cnt=rec?3:0;
 playing=true;follow=true;step=0;next=t0+cnt*bs;vis={s:0,t:next};
 for(let n=0;n<cnt;n++){click(t0+n*bs,n===0);setTimeout(()=>{if(playing)$('cd').textContent=3-n},(t0+n*bs-ac.currentTime)*1000)}
 if(cnt)setTimeout(()=>{$('cd').textContent=''},(next-ac.currentTime)*1000);
 timer=setInterval(tick,25);
 $('play').textContent='■ 停止';$('play').classList.add('on');
};
$('rec').onclick=()=>{rec=!rec;$('rec').classList.toggle('on',rec);$('rec').textContent=rec?'● 録音中':'● 録音'};
$('bpm').oninput=e=>$('bpmv').textContent=e.target.value;
$('vol').oninput=e=>{if(master)master.gain.value=e.target.value/100};
$('clear').onclick=()=>{grid.forEach(r=>r.fill(false));sel.clear();draw()};
$('demo').onclick=()=>{
 grid.forEach(r=>r.fill(false));bars=2;viewBar=0;
 for(let b=0;b<2;b++){const o=b*L;
  [0,4,8,12].forEach(s=>grid[0][o+s]=true);grid[0][o+10]=true;
  [4,12].forEach(s=>grid[1][o+s]=true);
  for(let s=0;s<L;s+=2)grid[2][o+s]=true;
  [0,3,6,8,11].forEach(s=>grid[9][o+s]=true)}
 grid[3][14]=true;grid[4][12]=true;grid[8][L]=true;grid[6][7]=true;
 for(let s=0;s<4;s++)grid[11][L+s]=grid[11][L+8+s]=true;sel.clear();
 segs();draw();
};
const keys={};T.forEach((t,i)=>keys[t.k.toLowerCase()]=i);
const kh={};
addEventListener('keydown',e=>{
 if(e.repeat||e.metaKey||e.ctrlKey)return;
 const i=keys[e.key.toLowerCase()];
 if(i!==undefined){kh[i]=hit(i);padEls[i].classList.add('hit')}
 else if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();$('play').click()}
});
addEventListener('keyup',e=>{
 const i=keys[e.key.toLowerCase()];
 if(i!==undefined){if(kh[i])kh[i](ac.currentTime);kh[i]=null;padEls[i].classList.remove('hit')}
});
$('demo').click();
</script>
</html>
